name: Build

# Windows installers can't be built on the Linux dev machine (electron-builder needs Wine there), so this workflow is how they are
# produced and tested: the NSIS installer is installed silently on a Windows runner and the desktop suite is run against it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Typecheck, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  android:
    name: Android APK and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # Present only if the signing key has been added to the repository's secrets (see README). Without it, releases carry the debug APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Accept SDK licences (lets Gradle fetch any missing platform)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the debug APK
        run: npm run apk -w @muster/mobile
      - name: Free disk space (the emulator wants a 7.4 GB data partition, and a hosted runner has just under that spare)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h / | tail -1
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # The plain Android image (no Google apps): the tests need only the system share sheet, print service, file picker and WebView, and
          # the Google image's background services overloaded a hosted runner until even SystemUI stopped responding.
          target: default
          # The default (2.5 GB, 2 cores) is tight with Google's services running: Android's low-memory killer was seen ending the app
          # mid-test. The runner has 16 GB and 4 cores.
          ram-size: 4096M
          cores: 4
          disable-animations: true
          script: npx playwright test -c playwright.android.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: muster-android-debug
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build the signed release APK (releases only, and only if the signing key is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muster.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/muster.keystore"
          npm run release -w @muster/mobile
          rm -f "$RUNNER_TEMP/muster.keystore"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: muster-android-release
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Node bundled in Electron 44
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build app bundle
        run: npm run build -w @muster/desktop
      - name: Build installers
        run: npx electron-builder --publish never
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code signing yet
      # Test the real artifacts, not the unpacked folders: the Linux AppImage itself, and the Windows installer run for real.
      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          export MUSTER_EXE="$(ls "$GITHUB_WORKSPACE"/release/*.AppImage | head -n 1)"
          chmod +x "$MUSTER_EXE"
          sudo apt-get install -y --no-install-recommends poppler-utils xvfb
          xvfb-run -a npx playwright test -c playwright.desktop.config.ts
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Install and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\Muster-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Muster.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Muster.exe was not installed' }
          Write-Host "Installed at $exe"
          $env:MUSTER_EXE = $exe
          npx playwright test -c playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: muster-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  # Pushing a tag such as v0.1.0 publishes a GitHub release with every installer. The tag must match the apps' version numbers.
  release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Gather the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          for pkg in packages/desktop packages/mobile; do
            v=$(node -p "require('./$pkg/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "::error::$pkg is version $v but the tag is $TAG"; exit 1; }
          done
          ls -la artifacts
          mkdir out
          cp artifacts/Muster-Setup-"$VERSION".exe artifacts/Muster-"$VERSION"-x86_64.AppImage artifacts/Muster-"$VERSION"-amd64.deb out/
          # What the desktop apps read to find a newer version (latest.yml for Windows, latest-linux.yml for the AppImage), and the block maps
          # that let the Windows installer download only what changed. They must be on every release or updating silently stops working.
          cp artifacts/latest.yml artifacts/latest-linux.yml out/
          cp artifacts/*.blockmap out/ 2>/dev/null || true
          if [ -f artifacts/app-release.apk ]; then
            cp artifacts/app-release.apk "out/Muster-$VERSION-android.apk"
          else
            cp artifacts/app-debug.apk "out/Muster-$VERSION-android-debug.apk"
          fi
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s/{{version}}/$VERSION/g" .github/release-notes.md > notes.md
          # What is new in this version: its section of the changelog, if there is one.
          awk -v v="$VERSION" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then { echo; echo "## What is new in $VERSION"; echo; cat changes.md; } >> notes.md; fi
          PRE=""
          case "$VERSION" in 0.*|*-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Muster $VERSION" --notes-file notes.md --verify-tag $PRE
          fi
